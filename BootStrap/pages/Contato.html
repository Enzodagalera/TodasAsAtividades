<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Terminal - Contato</title>
</head>
<body>
    <header>
        <div id="logo">
            <a href="../index.html"><img id="logo-img" src="../fotos/logo_cyber.png" alt="CyberGlow Logo"></a>
            <h1>CyberGlow</h1>
        </div>
        <nav class="navbar">
            <div class="navbar-nav">
                <a class="nav-link" href="../index.html">Drops</a>
                <a class="nav-link active" href="Contato.html">Terminal</a>
                <a class="nav-link" href="Sobre.html">Diretório</a>
            </div>
        </nav>
    </header>

    <main>
        <section style="margin-bottom: 30px;">
            <h2>Abrir Canal de Comunicação</h2>
            <p><strong>Net-Mail:</strong> uplink@cyberglow.tech</p>
            <p><strong>Frequência:</strong> (14) 99876-5432</p>
            <p><strong>Coordenadas:</strong> Setor Ciano, Prédio 404 - Neo-São Paulo</p>
        </section>

        <section id="Contato">
            <h2>Formulário de Uplink</h2>
            <form>
                <div>
                    <label class="form-label">Identificação (Nome)</label>
                    <input type="text" class="form-control" placeholder="Seu apelido na rede">
                </div>
                <div>
                    <label class="form-label">Endereço de Cripto-Mail</label>
                    <input type="email" class="form-control" placeholder="usuario@rede.com">
                </div>
                <div>
                    <label class="form-label">Mensagem Criptografada</label>
                    <textarea rows="5" class="form-control" placeholder="Digite sua solicitação de suporte ou negócios..."></textarea>
                </div>
                <div style="display: flex; gap: 15px;">
                    <button type="submit">Enviar Sinal</button>
                    <button type="reset" style="background: #22223b;">Limpar</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CyberGlow Tech. Conexão Segura.</p>
    </footer>
</body>
</html>
